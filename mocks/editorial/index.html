<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#1E4632">
    <title>Bytheway · Editorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
</head>
<body data-theme="light">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-listen" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.4a8 8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
            <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.4-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z" fill="currentColor"/></symbol>
            <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor"/></symbol>
            <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
            <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
            <symbol id="i-pocket" viewBox="0 0 24 24"><rect x="6.5" y="3" width="11" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8.6" y="5.2" width="6.8" height="11.6" rx=".8" fill="currentColor"/></symbol>
            <symbol id="i-recenter" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
            <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 1.5H5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10.2 20.2a2 2 0 0 0 3.6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
            <symbol id="i-up" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9.5 3.5h5M10.5 3.5v5.2L5.4 18a1.6 1.6 0 0 0 1.4 2.5h10.4a1.6 1.6 0 0 0 1.4-2.5l-5.1-9.3V3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7.6 14.5h8.8" stroke="currentColor" stroke-width="1.7"/></symbol>
            <symbol id="i-sim-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></symbol>
            <symbol id="i-gps" viewBox="0 0 24 24"><path d="M20 4L4 11l7 2 2 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
            <symbol id="i-restart" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 4.5V9h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        </defs>
    </svg>

    <div id="map" class="map" role="region" aria-label="Mapa"></div>

    <!-- Chrome del mapa -->
    <header class="topbar" id="topbar">
        <button class="demo-pill" id="demo-btn" type="button" aria-expanded="false" aria-controls="demo-panel">
            <svg aria-hidden="true"><use href="#i-flask"/></svg><span data-t="demo">Demo</span>
        </button>
        <div class="topbar__end">
            <button class="tool" id="pocket-btn" type="button" data-t-label="pocket"><svg aria-hidden="true"><use href="#i-pocket"/></svg></button>
            <button class="tool" id="settings-btn" type="button" data-t-label="settings"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
        </div>
    </header>

    <button class="tool compass" id="north-btn" type="button" aria-pressed="false">
        <svg class="compass__needle" id="needle" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l3.2 9H8.8z" class="compass__n"/><path d="M12 21l-3.2-9h6.4z" class="compass__s"/>
        </svg>
        <span class="compass__mode" id="north-mode"></span>
    </button>

    <section class="demo-panel" id="demo-panel" hidden aria-labelledby="demo-title">
        <div class="demo-panel__head">
            <h2 id="demo-title" data-t="demoTitle">Herramientas de demo</h2>
            <p data-t="demoNote"></p>
        </div>
        <button class="demo-row" id="sim-toggle" type="button"><svg aria-hidden="true"><use href="#i-sim-play"/></svg><span id="sim-toggle-label"></span></button>
        <fieldset>
            <legend class="demo-legend" data-t="profile"></legend>
            <div class="seg seg--demo">
                <label><input type="radio" name="profile" value="walk"><span data-t="walk"></span></label>
                <label><input type="radio" name="profile" value="bike"><span data-t="bike"></span></label>
                <label><input type="radio" name="profile" value="car"><span data-t="car"></span></label>
            </div>
        </fieldset>
        <fieldset>
            <legend class="demo-legend" data-t="clock"></legend>
            <div class="seg seg--demo">
                <label><input type="radio" name="scale" value="1"><span>×1</span></label>
                <label><input type="radio" name="scale" value="4"><span>×4</span></label>
                <label><input type="radio" name="scale" value="10"><span>×10</span></label>
            </div>
        </fieldset>
        <div class="demo-panel__pair">
            <button class="demo-row" id="sim-restart" type="button"><svg aria-hidden="true"><use href="#i-restart"/></svg><span data-t="restart"></span></button>
            <button class="demo-row" id="gps-btn" type="button" aria-pressed="false"><svg aria-hidden="true"><use href="#i-gps"/></svg><span data-t="useGps"></span></button>
        </div>
        <p class="demo-readout" id="demo-readout" aria-live="polite"></p>
    </section>

    <!-- Burbuja anclada al POI -->
    <button class="bubble" id="bubble" type="button" hidden>
        <span class="bubble__title" id="bubble-title"></span>
        <span class="bubble__meta"><span id="bubble-meta"></span><svg aria-hidden="true"><use href="#i-up"/></svg></span>
    </button>

    <button class="recenter" id="recenter" type="button" hidden>
        <svg aria-hidden="true"><use href="#i-recenter"/></svg><span data-t="recenter"></span>
    </button>

    <!-- Ficha: una página de la guía -->
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" aria-hidden="true">
        <div class="sheet__grip" id="sheet-grip" aria-hidden="true"><span></span></div>
        <button class="icon-btn sheet__close" id="sheet-close" type="button" data-t-label="close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        <div class="sheet__scroll" id="sheet-scroll">
            <article class="page">
                <header class="page__head">
                    <span class="page__book">Bytheway</span>
                    <span class="page__where" id="sheet-where"></span>
                </header>
                <h2 class="page__title" id="sheet-title" tabindex="-1"></h2>
                <p class="page__badges" id="sheet-badges"></p>
                <div class="page__actions">
                    <button class="btn btn--primary btn--lg" id="sheet-listen" type="button">
                        <svg aria-hidden="true"><use href="#i-listen"/></svg><span id="sheet-listen-label"></span>
                    </button>
                    <span class="page__length" id="sheet-length"></span>
                </div>
                <div class="prose" id="sheet-prose"></div>
                <footer class="page__folio" id="sheet-folio"></footer>
            </article>
        </div>
    </section>

    <!-- Pila inferior: A continuación, Anuncio, reproductor -->
    <div class="stack" id="stack">
        <div class="queue" id="queue" role="status" hidden>
            <svg aria-hidden="true"><use href="#i-bell"/></svg>
            <span class="queue__label" data-t="next"></span>
            <span class="queue__title" id="queue-title"></span>
            <span class="queue__more" id="queue-more"></span>
        </div>

        <article class="card" id="card" hidden aria-labelledby="card-title">
            <p class="card__where" id="card-where"></p>
            <h2 class="card__title" id="card-title"><button type="button" id="card-open" class="card__open"></button></h2>
            <p class="card__badges" id="card-badges"></p>
            <div class="card__actions">
                <button class="btn btn--primary btn--xl" id="card-listen" type="button"><svg aria-hidden="true"><use href="#i-listen"/></svg><span data-t="listen"></span></button>
                <button class="btn btn--quiet" id="card-read" type="button" data-t="read"></button>
            </div>
            <button class="icon-btn card__close" id="card-close" type="button" data-t-label="dismiss"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
            <div class="card__timer" id="card-timer" aria-hidden="true"><span></span></div>
        </article>

        <section class="player" id="player" hidden data-t-region="listening">
            <div class="player__rule" aria-hidden="true"><span id="player-bar"></span></div>
            <div class="player__row">
                <button class="player__toggle" id="player-toggle" type="button"><svg aria-hidden="true"><use id="player-toggle-icon" href="#i-pause"/></svg></button>
                <button class="player__info" id="player-info" type="button">
                    <span class="player__state" id="player-state"></span>
                    <span class="player__title" id="player-title"></span>
                    <span class="player__progress" id="player-progress"></span>
                </button>
                <button class="icon-btn" id="player-stop" type="button" data-t-label="stop"><svg aria-hidden="true"><use href="#i-stop"/></svg></button>
            </div>
        </section>

        <p class="status" id="status"><span class="status__dot" aria-hidden="true"></span><span data-t="guideOn"></span></p>
    </div>

    <!-- Ajustes -->
    <dialog class="settings" id="settings" aria-labelledby="settings-title">
        <header class="settings__head">
            <h2 id="settings-title" data-t="settings" tabindex="-1" autofocus></h2>
            <button class="icon-btn" id="settings-close" type="button" data-t-label="close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        </header>
        <fieldset class="settings__group">
            <legend data-t="language"></legend>
            <div class="seg">
                <label><input type="radio" name="lang" value="es"><span>Español</span></label>
                <label><input type="radio" name="lang" value="en"><span>English</span></label>
            </div>
        </fieldset>
        <div class="settings__row">
            <label class="switch">
                <span class="switch__text"><span data-t="darkMap"></span><span class="settings__hint" data-t="darkHint"></span></span>
                <input type="checkbox" role="switch" id="dark-toggle">
                <span class="switch__track" aria-hidden="true"></span>
            </label>
        </div>
        <div class="settings__row">
            <button class="btn btn--primary btn--block" id="pocket-enter" type="button"><svg aria-hidden="true"><use href="#i-pocket"/></svg><span data-t="pocketEnter"></span></button>
            <p class="settings__hint" data-t="pocketHint"></p>
        </div>
        <div class="settings__row settings__row--split">
            <div><p class="settings__label" data-t="resetSession"></p><p class="settings__hint" data-t="resetSessionHint"></p></div>
            <button class="btn btn--outline" id="reset-session" type="button" data-t="reset"></button>
        </div>
        <div class="settings__row settings__row--split settings__row--mock">
            <div><p class="settings__label" data-t="resetHeard"></p><p class="settings__hint" data-t="resetHeardHint"></p></div>
            <button class="btn btn--outline" id="reset-heard" type="button" data-t="clear"></button>
        </div>
    </dialog>

    <!-- Modo bolsillo -->
    <div class="pocket" id="pocket" hidden tabindex="-1" role="dialog" aria-modal="true" data-t-label="pocket">
        <p class="pocket__alive" id="pocket-alive"></p>
        <p class="pocket__now" id="pocket-now"></p>
        <p class="pocket__exit" data-t="pocketExit"></p>
    </div>

    <!-- Portada -->
    <section class="start" id="start" aria-labelledby="start-title">
        <div class="start__inner">
            <fieldset class="start__lang">
                <legend class="sr-only" data-t="language"></legend>
                <div class="seg seg--small">
                    <label><input type="radio" name="lang-start" value="es"><span lang="es">ES</span></label>
                    <label><input type="radio" name="lang-start" value="en"><span lang="en">EN</span></label>
                </div>
            </fieldset>
            <div class="start__title">
                <h1 id="start-title">Bytheway</h1>
                <p class="start__tagline" data-t="tagline"></p>
            </div>
            <figure class="legend">
                <figcaption data-t="legendTitle"></figcaption>
                <ul>
                    <li><span class="legend__icon" data-icon="pending"></span><span data-t="legendPending"></span></li>
                    <li><span class="legend__icon" data-icon="announced"></span><span data-t="legendAnnounced"></span></li>
                    <li><span class="legend__icon" data-icon="heard"></span><span data-t="heard"></span></li>
                    <li><span class="legend__icon" data-icon="playing"></span><span data-t="legendPlaying"></span></li>
                </ul>
            </figure>
            <div class="start__go">
                <p class="start__hint" data-t="startHint"></p>
                <button class="btn btn--primary btn--xl btn--block" id="start-btn" type="button" disabled><span id="start-label"></span></button>
            </div>
        </div>
    </section>

    <div class="toast" id="toast" role="alert" hidden></div>

    <script type="module" src="./main.ts"></script>
</body>
</html>
